name: Replenish reviewed cinema catalogue
on:
  schedule:
    - cron: '17 8,10 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      force:
        description: 'Check above the inventory targets; keeps all safety and daily limits'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: tiktok-publisher
  cancel-in-progress: false
jobs:
  replenish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read publication journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/${{ github.repository }}/contents/state.json?ref=bot-state' --jq .content | base64 --decode > /tmp/cinema-publication-journal.json
      - name: Review and replenish
        id: renewal
        env:
          FORCE_CHECK: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE_CHECK" = true ]; then args+=(--force); fi
          python -m tiktok_daily.cinema_renewal --journal /tmp/cinema-publication-journal.json "${args[@]}"
      - name: Verify catalogue and publisher
        run: python -m unittest discover -s tests -q
      - name: Save verified data
        run: |
          git add assets/cinema-catalog.json assets/cinema-renewal.json
          if ! git diff --cached --quiet; then
            git -c user.name='Daily Image Bot' -c user.email='daily-image-bot@users.noreply.github.com' commit -m 'Renew source-verified cinema inventory [skip ci]'
            git push origin HEAD:main
          fi
      - name: Report renewal health
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          JOB_STATUS: ${{ job.status }}
          NEEDS_ATTENTION: ${{ steps.renewal.outputs.needs_attention }}
        with:
          script: |
            const title = 'Daily TikTok: automatic cinema renewal needs attention';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const body = 'تعذّر التحقق أو حفظ تجديد قائمة الترشيحات. النشر من المخزون السابق يستمر. لا تُضاف أعمال ناقصة التحقق.\n\nالتشغيل: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const issue = issues.find(x=>!x.pull_request && x.title===title);
            if (process.env.JOB_STATUS === 'success' && process.env.NEEDS_ATTENTION !== 'true') {
              if (issue) await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed'});
              return;
            }
            if (issue) await github.rest.issues.update({...context.repo, issue_number:issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
