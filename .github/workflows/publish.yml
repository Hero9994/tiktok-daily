name: Daily TikTok

on:
  schedule:
    # Every wake-up books BOTH posts in Buffer well before their due times.
    # GitHub cron can be delayed or dropped; it is not the publication clock.
    - cron: '0 12 * * *'
      timezone: 'Europe/Berlin'
    # Retry within the two-hour lead before sports publication.
    - cron: '20,40 12 * * *'
      timezone: 'Europe/Berlin'
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'doctor/discover/check-openai/check-football are read-only; publish-test publishes ONE real post now and uses OpenAI credit'
        type: choice
        default: doctor
        options: [doctor, discover, inspect-buffer, check-openai, check-football, prepare, verify, wait-first, publish-test, publish-correction, publish-preview, maintain]
      post_id:
        description: 'Optional specific Buffer post for wait-first delivery verification'
        type: string
        default: ''
      preview_id:
        description: 'Explicitly approved one-off cinema preview ID'
        type: string
        default: ''
      correction_id:
        description: 'Explicitly approved one-off correction ID (publish-correction only)'
        type: string
        default: ''
      track:
        description: 'Daily content/music track'
        type: choice
        default: cinema
        options: [football, cinema]

permissions:
  contents: write
  issues: write

concurrency:
  group: tiktok-publisher
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'wait-first' && 45 || 15 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ensure video encoder
        if: inputs.mode == 'prepare' || inputs.mode == 'publish-test' || inputs.mode == 'publish-correction' || inputs.mode == 'publish-preview' || inputs.mode == 'maintain' || github.event_name == 'schedule'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Run publisher
        id: publisher
        env:
          MODE_INPUT: ${{ inputs.mode }}
          TRACK_INPUT: ${{ inputs.track }}
          POST_INPUT: ${{ inputs.post_id }}
          PREVIEW_INPUT: ${{ inputs.preview_id }}
          CORRECTION_INPUT: ${{ inputs.correction_id }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        shell: bash
        run: |
          mode="${MODE_INPUT:-verify}"
          track="${TRACK_INPUT:-cinema}"
          if [ -n "$EVENT_SCHEDULE" ]; then mode=maintain; fi
          python -m tiktok_daily "$mode" --track "$track" --correction-id "${CORRECTION_INPUT:-}" --preview-id "${PREVIEW_INPUT:-}" --post-id "${POST_INPUT:-}"
      - name: Warn before reviewed cinema catalogue runs out
        if: ${{ always() && steps.publisher.outputs.cinema_remaining != '' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CINEMA_REMAINING: ${{ steps.publisher.outputs.cinema_remaining }}
          ARABIC_REMAINING: ${{ steps.publisher.outputs.cinema_arabic_remaining }}
          EGYPTIAN_REMAINING: ${{ steps.publisher.outputs.cinema_egyptian_remaining }}
          SYRIAN_REMAINING: ${{ steps.publisher.outputs.cinema_syrian_remaining }}
        with:
          script: |
            const remaining = Number(process.env.CINEMA_REMAINING);
            const arabic = Number(process.env.ARABIC_REMAINING);
            const egyptian = Number(process.env.EGYPTIAN_REMAINING);
            const syrian = Number(process.env.SYRIAN_REMAINING);
            const title = 'Daily TikTok: reviewed cinema catalogue running low';
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const issue = issues.find(x => !x.pull_request && x.title === title);
            if (remaining > 7 && arabic > 7 && egyptian > 3 && syrian > 3) {
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            } else {
              const body = `بقي ${remaining} عملًا مؤهلًا غير منشور، منها ${arabic} عربية (${egyptian} مصرية و${syrian} سورية). أضف أعمالًا مراجعة قبل نفاد القائمة، مع شروط الجودة والعمر والمحتوى الجنسي ومنع التكرار. لا تخفف الشروط تلقائيًا.`;
              if (issue && issue.body !== body) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
              else if (!issue) await github.rest.issues.create({ ...context.repo, title, body });
            }
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = 'Daily TikTok: publication needs attention';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `فشل تشغيل النشر أو التحقق. افحص [سجل التشغيل](${run}) وBuffer. لا تعد إرسال منشور ذي نتيجة غير مؤكدة. لا توجد مفاتيح أو محتويات ردود API في هذا التنبيه.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const issue = issues.find(x => !x.pull_request && x.title === title);
            if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
