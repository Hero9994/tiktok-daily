name: Preview future football card
on:
  workflow_dispatch:
    inputs:
      post_day:
        description: 'Publication date (YYYY-MM-DD); fixtures follow fixture_day setting'
        type: string
        required: true
      results:
        description: 'Preview verified big-five final scores (no publishing)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: |
          args=(--post-day "$POST_DAY")
          if [ "$RESULTS" = "true" ]; then args+=(--results); fi
          python -m tiktok_daily.football_preview "${args[@]}"
        env:
          POST_DAY: ${{ inputs.post_day }}
          RESULTS: ${{ inputs.results }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: football-preview
          path: preview-output/
          retention-days: 7
