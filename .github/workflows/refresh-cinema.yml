name: Refresh queued cinema graphics
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Existing queued cinema Buffer post ID; changes its media only'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: tiktok-publisher
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python -m tiktok_daily.refresh_cinema "$POST_ID"
        env:
          POST_ID: ${{ inputs.post_id }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
